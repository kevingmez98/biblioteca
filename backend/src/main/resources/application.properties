spring.application.name=biblioteca

# MySQL (usuario de la aplicacion: solo DML)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${MYSQL_DATABASE:biblioteca}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${APP_USER:app_user}
spring.datasource.password=${APP_PASSWORD:App_D3v_2026!}

# Flyway (usuario con permisos DDL, separado del de la aplicacion)
spring.flyway.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${MYSQL_DATABASE:biblioteca}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.flyway.user=${MYSQL_USER:admin}
spring.flyway.password=${MYSQL_PASSWORD:D3v_2026!}
spring.flyway.baseline-on-migrate=true

# Server
server.port=${SERVER_PORT:8080}

# JPA (el esquema lo gestiona Flyway; validate solo verifica que no haya desfase)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Rest
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
